name: Color Labs Inc. (Apple)
description: 'Color Labs Inc. was a Palo Alto, California social photo-sharing startup
  founded in 2011 by Bill Nguyen and Peter Pham. Its Color mobile app let people photograph
  and browse photos taken nearby, grouping content by proximity and social graph. The
  company raised roughly $41 million before launch — $25 million from Sequoia Capital,
  $9 million from Bain Capital Ventures, and $7 million in venture debt from Silicon
  Valley Bank — and reportedly declined a $200 million acquisition offer from Google.
  After a March 2011 launch that drew about a million downloads but fell under 100,000
  active users by September 2011, the board voted in October 2012 to wind the company
  down and the service closed at the end of that year. Apple then acqui-hired the remaining
  engineering team in a talent acquisition reported at roughly $2–7 million. Color Labs
  never shipped a public developer API, SDK, or developer portal, and it has had no live
  web or API surface since 2012. Its former domain, color.com, is today operated by the
  unrelated Color Health, Inc. This profile is retained as a historical record of a Bain
  Capital Ventures portfolio company; there is no API surface to enrich.'
